name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: The tag to publish, such as v0.1.1 (default is this branch)
        type: string
        default: ""
      dry_run:
        description: Preview the publish without uploading
        type: boolean
        default: true

# The ClawHub workflow's job needs these, and a called job may not ask for
# more than the caller grants. id-token lets it publish as this repository's
# trusted publisher.
permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json v$version"
            exit 1
          fi
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - name: Committed dist is current
        run: |
          npm run build
          git diff --exit-code -- dist

  clawhub:
    needs: check
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@v0.23.3
    # ClawHub's trusted publishing works on a dispatched run only, and it
    # refuses an owner input: the trusted publisher record names the owner.
    with:
      source: architect-xyz/openclaw-liquid-inference@${{ inputs.ref || github.ref_name }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
